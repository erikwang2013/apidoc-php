<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-label="UIC-1 统一后端契约：一份 apidoc-ui 自动识别 PHP、Go、Rust 后端">
  <defs>
    <linearGradient id="ubg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F1FE"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="udots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.6" fill="#CFC9EE" opacity=".5"/>
    </pattern>
  </defs>
  <rect width="1120" height="560" rx="24" fill="url(#ubg)"/>
  <rect width="1120" height="560" rx="24" fill="url(#udots)"/>

  <text x="48" y="64" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#3B3663">UIC-1 统一后端契约</text>
  <text x="48" y="94" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#8B86AD">一份 apidoc-ui · PHP / Go / Rust 自动识别 · 能力协商</text>

  <!-- UI -->
  <rect x="320" y="120" width="480" height="94" rx="18" fill="#3B3663"/>
  <text x="352" y="158" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">apidoc-ui</text>
  <text x="352" y="184" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#C9C3E8">一份静态构建，适配三套后端；启动时自动识别</text>
  <rect x="676" y="142" width="100" height="28" rx="14" fill="#6C5CE7"/>
  <text x="726" y="161" text-anchor="middle" font-family="Noto Sans Mono CJK SC, monospace" font-size="13" fill="#FFFFFF">BACKEND=auto</text>

  <!-- capabilities -->
  <rect x="328" y="238" width="464" height="42" rx="12" fill="#F1EEFF" stroke="#DCD7F7"/>
  <text x="348" y="264" font-family="Noto Sans Mono CJK SC, monospace" font-size="14" fill="#6C5CE7">GET /ui/v1/capabilities · contract 1.0</text>
  <path d="M 560 214 L 560 236" stroke="#B9B1E8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 560 280 L 560 302" stroke="#B9B1E8" stroke-width="2" stroke-linecap="round"/>

  <!-- backends -->
  <rect x="48" y="316" width="320" height="164" rx="16" fill="#FFFFFF" stroke="#E3DFF7" stroke-width="2"/>
  <text x="72" y="350" font-family="Noto Sans Mono CJK SC, monospace" font-size="20" font-weight="700" fill="#3B3663">PHP</text>
  <text x="72" y="378" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">read / auth / docs</text>
  <text x="72" y="401" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">browser + relay debug</text>
  <text x="72" y="424" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">share / cache / generator</text>
  <text x="72" y="447" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">9 种定义格式 · 27 个调试驱动</text>
  <rect x="264" y="332" width="76" height="24" rx="12" fill="#DCF6E6"/>
  <text x="302" y="349" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="11" fill="#277A4E">full</text>

  <rect x="400" y="316" width="320" height="164" rx="16" fill="#FFFFFF" stroke="#E3DFF7" stroke-width="2"/>
  <text x="424" y="350" font-family="Noto Sans Mono CJK SC, monospace" font-size="20" font-weight="700" fill="#3B3663">Go</text>
  <text x="424" y="378" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">read / auth / docs</text>
  <text x="424" y="401" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">browser + relay debug</text>
  <text x="424" y="424" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">share / cache / generator</text>
  <text x="424" y="447" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#277A4E">server relay / executors</text>
  <rect x="616" y="332" width="76" height="24" rx="12" fill="#DCF6E6"/>
  <text x="654" y="349" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="11" fill="#277A4E">full</text>

  <rect x="752" y="316" width="320" height="164" rx="16" fill="#FFFFFF" stroke="#E3DFF7" stroke-width="2"/>
  <text x="776" y="350" font-family="Noto Sans Mono CJK SC, monospace" font-size="20" font-weight="700" fill="#3B3663">Rust</text>
  <text x="776" y="378" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">read / auth / docs</text>
  <text x="776" y="401" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">browser + relay debug</text>
  <text x="776" y="424" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">share / build cache / generator</text>
  <text x="776" y="447" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">9 definitions / Vue UI</text>
  <rect x="968" y="332" width="76" height="24" rx="12" fill="#DCF6E6"/>
  <text x="1006" y="349" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="11" fill="#277A4E">full</text>

  <!-- status / footer -->
  <rect x="48" y="500" width="1024" height="38" rx="10" fill="#FFFFFF" stroke="#E3DFF7"/>
  <text x="68" y="524" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">UIC-1 全量完成：读 / 鉴权 / 文档 / 调试 / 分享 / 缓存 / 生成器 / 导出</text>
  <text x="1024" y="524" text-anchor="end" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#277A4E">Go 执行器 · 9 种定义解析 · 三端共用 Vue UI</text>
</svg>
