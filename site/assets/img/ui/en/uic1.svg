<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-label="UIC-1 unified backend contract：一份 apidoc-ui 自动识别 PHP、Go、Rust 后端">
  <defs>
    <linearGradient id="ubg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F1FE"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="udots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.6" fill="#CFC9EE" opacity=".5"/>
    </pattern>
  </defs>
  <rect width="1120" height="560" rx="24" fill="url(#ubg)"/>
  <rect width="1120" height="560" rx="24" fill="url(#udots)"/>

  <text x="48" y="64" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#3B3663">UIC-1 unified backend contract</text>
  <text x="48" y="94" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#8B86AD">One apidoc-ui · auto-detect PHP / Go / Rust · capability negotiation</text>

  <!-- UI -->
  <rect x="320" y="120" width="480" height="94" rx="18" fill="#3B3663"/>
  <text x="352" y="158" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">apidoc-ui</text>
  <text x="352" y="184" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#C9C3E8">One static build for three backends; detected at startup</text>
  <rect x="676" y="142" width="100" height="28" rx="14" fill="#6C5CE7"/>
  <text x="726" y="161" text-anchor="middle" font-family="Noto Sans Mono CJK SC, monospace" font-size="13" fill="#FFFFFF">BACKEND=auto</text>

  <!-- capabilities -->
  <rect x="328" y="238" width="464" height="42" rx="12" fill="#F1EEFF" stroke="#DCD7F7"/>
  <text x="348" y="264" font-family="Noto Sans Mono CJK SC, monospace" font-size="14" fill="#6C5CE7">GET /ui/v1/capabilities · contract 1.0</text>
  <path d="M 560 214 L 560 236" stroke="#B9B1E8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 560 280 L 560 302" stroke="#B9B1E8" stroke-width="2" stroke-linecap="round"/>

  <!-- backends -->
  <rect x="48" y="316" width="320" height="178" rx="16" fill="#FFFFFF" stroke="#E3DFF7" stroke-width="2"/>
  <text x="72" y="350" font-family="Noto Sans Mono CJK SC, monospace" font-size="20" font-weight="700" fill="#3B3663">PHP</text>
  <text x="72" y="378" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">read / auth / docs</text>
  <text x="72" y="401" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">browser + relay debug</text>
  <text x="72" y="424" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">share / cache / generator</text>
  <text x="72" y="447" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">9 definition formats</text>
  <text x="72" y="470" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">27 debug drivers</text>
  <rect x="264" y="332" width="84" height="24" rx="12" fill="#DCF6E6"/>
  <text x="306" y="349" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="11" fill="#277A4E">v1.2.0</text>

  <rect x="400" y="316" width="320" height="178" rx="16" fill="#FFFFFF" stroke="#E3DFF7" stroke-width="2"/>
  <text x="424" y="350" font-family="Noto Sans Mono CJK SC, monospace" font-size="20" font-weight="700" fill="#3B3663">Go</text>
  <text x="424" y="378" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">read / auth / docs</text>
  <text x="424" y="401" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">browser + relay (build tags)</text>
  <text x="424" y="424" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">share / cache / generator</text>
  <text x="424" y="447" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">9 definition formats</text>
  <text x="424" y="470" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">UIPath built-in Vue UI</text>
  <rect x="616" y="332" width="84" height="24" rx="12" fill="#FFF0D8"/>
  <text x="658" y="349" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="11" fill="#9A5B00">v1.1.0</text>

  <rect x="752" y="316" width="320" height="178" rx="16" fill="#FFFFFF" stroke="#E3DFF7" stroke-width="2"/>
  <text x="776" y="350" font-family="Noto Sans Mono CJK SC, monospace" font-size="20" font-weight="700" fill="#3B3663">Rust</text>
  <text x="776" y="378" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">read / auth / docs</text>
  <text x="776" y="401" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">browser + unary relay</text>
  <text x="776" y="424" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">share / build cache / templates</text>
  <text x="776" y="447" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">9 definition formats / AsyncAPI</text>
  <text x="776" y="470" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#5C5680">ui_path Vue + native UI</text>
  <rect x="968" y="332" width="84" height="24" rx="12" fill="#FFF0D8"/>
  <text x="1010" y="349" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="11" fill="#9A5B00">v2.2.0</text>

  <!-- footer -->
  <rect x="48" y="510" width="1024" height="32" rx="10" fill="#FFFFFF" stroke="#E3DFF7"/>
  <text x="68" y="531" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#5C5680">Contract 1.0: read / auth / docs / debug / share / cache / generator / export / definitions</text>
  <text x="1024" y="531" text-anchor="end" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#C0392B">Capabilities are exact · Rust build cache / templates only</text>
</svg>
