<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" role="img" aria-label="任意协议调试：浏览器直连、协议注解与服务端中继">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F5FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="pdots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.6" fill="#CFC9EE" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="1120" height="520" rx="24" fill="url(#pbg)"/>
  <rect width="1120" height="520" rx="24" fill="url(#pdots)"/>

  <text x="48" y="66" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#3B3663">任意协议调试</text>
  <text x="48" y="96" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#8B86AD">Arbitrary protocol debugging · PHP 8 attributes</text>

  <!-- 浏览器直连 -->
  <rect x="48" y="122" width="330" height="300" rx="18" fill="#FFFFFF" stroke="#E3DFF7" stroke-width="2"/>
  <text x="72" y="162" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#3B3663">浏览器直连</text>
  <text x="72" y="188" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#8B86AD">同源 / CORS 约束，不经过服务端</text>
  <g font-family="Source Han Mono, Noto Sans Mono CJK SC, monospace" font-size="15" fill="#4B4470">
    <rect x="72" y="210" width="282" height="38" rx="10" fill="#F1EEFF" stroke="#DCD7F7"/>
    <text x="88" y="235">HTTP · REST · SOAP · GraphQL</text>
    <rect x="72" y="258" width="132" height="38" rx="10" fill="#F1EEFF" stroke="#DCD7F7"/>
    <text x="88" y="283">WebSocket</text>
    <rect x="216" y="258" width="138" height="38" rx="10" fill="#F1EEFF" stroke="#DCD7F7"/>
    <text x="232" y="283">SSE</text>
  </g>
  <text x="72" y="340" font-family="Noto Sans Mono CJK SC, monospace" font-size="13" fill="#6C5CE7">browser-http · browser-websocket</text>
  <text x="72" y="362" font-family="Noto Sans Mono CJK SC, monospace" font-size="13" fill="#6C5CE7">browser-sse</text>
  <text x="72" y="390" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#8B86AD">调试请求从用户浏览器发出</text>

  <!-- 协议注解 -->
  <rect x="395" y="122" width="330" height="300" rx="18" fill="#3B3663"/>
  <text x="419" y="162" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">协议注解</text>
  <text x="419" y="188" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#C9C3E8">声明协议身份、地址与驱动</text>
  <g font-family="Source Han Mono, Noto Sans Mono CJK SC, monospace" font-size="15" fill="#F4F1FE">
    <text x="419" y="230">#[Protocol('mqtt')]</text>
    <text x="419" y="262">#[Channel('/sensors/+/temp')]</text>
    <text x="419" y="294">#[Debug(driver: 'mqtt')]</text>
    <text x="419" y="326">#[Param(name: 'value')]</text>
  </g>
  <rect x="419" y="352" width="282" height="40" rx="10" fill="#6C5CE7"/>
  <text x="435" y="378" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#FFFFFF">自动生成字段与调试面板</text>

  <!-- 服务端中继 -->
  <rect x="742" y="122" width="330" height="300" rx="18" fill="#FFFFFF" stroke="#E3DFF7" stroke-width="2"/>
  <text x="766" y="162" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#3B3663">服务端中继</text>
  <text x="766" y="188" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#8B86AD">目标只来自注解，客户端不可改</text>
  <g font-family="Source Han Mono, Noto Sans Mono CJK SC, monospace" font-size="15" fill="#4B4470">
    <rect x="766" y="210" width="138" height="38" rx="10" fill="#F1EEFF" stroke="#DCD7F7"/>
    <text x="782" y="235">MQTT · STOMP</text>
    <rect x="916" y="210" width="132" height="38" rx="10" fill="#F1EEFF" stroke="#DCD7F7"/>
    <text x="932" y="235">gRPC</text>
    <rect x="766" y="258" width="138" height="38" rx="10" fill="#F1EEFF" stroke="#DCD7F7"/>
    <text x="782" y="283">TCP / UDP</text>
    <rect x="916" y="258" width="132" height="38" rx="10" fill="#F1EEFF" stroke="#DCD7F7"/>
    <text x="932" y="283">CoAP</text>
    <rect x="766" y="306" width="138" height="38" rx="10" fill="#F1EEFF" stroke="#DCD7F7"/>
    <text x="782" y="331">Modbus</text>
    <rect x="916" y="306" width="132" height="38" rx="10" fill="#F1EEFF" stroke="#DCD7F7"/>
    <text x="932" y="331">RTSP / SIP</text>
  </g>
  <text x="766" y="374" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#C0392B">默认关闭 · 鉴权 · 限速</text>
  <text x="766" y="398" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#C0392B">超时 / 字节 / 会话上限</text>

  <!-- 连接箭头 -->
  <path d="M 384 272 L 388 272" stroke="#B9B1E8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 731 272 L 735 272" stroke="#B9B1E8" stroke-width="4" stroke-linecap="round"/>

  <!-- 定义解析 -->
  <rect x="48" y="446" width="1024" height="44" rx="12" fill="#FFFFFF" stroke="#E3DFF7"/>
  <text x="68" y="474" font-family="Noto Sans Mono CJK SC, monospace" font-size="16" fill="#6C5CE7">Definition</text>
  <text x="176" y="474" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#5C5680">OpenAPI · AsyncAPI · GraphQL · protobuf · WSDL/XSD · EDMX · JSON Schema · JSON-RPC · XML-RPC</text>
</svg>
